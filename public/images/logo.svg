<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    
    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <path d="M 250 30 L 430 90 L 430 280 C 430 380 330 450 250 480 C 170 450 70 380 70 280 L 70 90 Z" fill="url(#bgGrad)" stroke="url(#orangeGrad)" stroke-width="12" rx="20"/>

  <!-- Inner Crest Border -->
  <path d="M 250 50 L 410 105 L 410 270 C 410 360 320 425 250 455 C 180 425 90 360 90 270 L 90 105 Z" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-dasharray="10 5" opacity="0.6"/>

  <!-- Basketball Circle Outer Ring -->
  <circle cx="250" cy="240" r="110" fill="url(#orangeGrad)" filter="url(#glow)"/>

  <!-- Basketball Seams & Wave Curves -->
  <!-- Horizontal Center Rib -->
  <path d="M 140 240 Q 250 220 360 240" fill="none" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>
  <!-- Vertical Curved Rib -->
  <path d="M 250 130 Q 230 240 250 350" fill="none" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>
  <!-- Left Curved Seam -->
  <path d="M 170 170 Q 240 240 170 310" fill="none" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>
  <!-- Right Curved Seam -->
  <path d="M 330 170 Q 260 240 330 310" fill="none" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>

  <!-- Ocean Waves overlay at base of ball -->
  <path d="M 120 300 Q 180 250 250 300 T 380 300 L 380 360 L 120 360 Z" fill="url(#cyanGrad)" opacity="0.75"/>
  <path d="M 100 320 Q 170 270 250 320 T 400 320 L 400 380 L 100 380 Z" fill="#0F172A" opacity="0.5"/>

  <!-- Stars -->
  <polygon points="250,70 256,85 272,85 259,95 264,110 250,100 236,110 241,95 228,85 244,85" fill="url(#goldGrad)"/>
  <polygon points="180,95 184,106 196,106 186,113 190,124 180,117 170,124 174,113 164,106 176,106" fill="url(#goldGrad)"/>
  <polygon points="320,95 324,106 336,106 326,113 330,124 320,117 310,124 314,113 304,106 316,106" fill="url(#goldGrad)"/>

  <!-- Text Badge Banner -->
  <rect x="80" y="380" width="340" height="60" rx="15" fill="#0F172A" stroke="url(#orangeGrad)" stroke-width="4"/>
  <text x="250" y="420" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="3">OCEAN BASKETBALL</text>
</svg>
